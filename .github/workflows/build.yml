# Windows (.exe) болон macOS (.app)-г GitHub дээр автоматаар бүтээнэ.
# GitHub -> Actions -> "build" -> "Run workflow" дарахад бүтээгээд Artifacts хэсэгт гаргана.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller AjliinButeemj.spec --noconfirm

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\AjliinButeemj.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\AjliinButeemj\app.log"
          exit $p.ExitCode

      - name: Self-test (macOS) + zip
        if: runner.os == 'macOS'
        run: |
          dist/AjliinButeemj.app/Contents/MacOS/AjliinButeemj --selftest
          ditto -c -k --keepParent dist/AjliinButeemj.app dist/AjliinButeemj-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AjliinButeemj-${{ runner.os }}
          path: |
            dist/AjliinButeemj.exe
            dist/AjliinButeemj-mac.zip
            config.example.json
          if-no-files-found: ignore
