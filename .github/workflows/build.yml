# Windows (.exe) болон macOS (.app)-г GitHub дээр бүтээнэ.
# - "Run workflow" (гараар): бүтээгээд Artifacts хэсэгт гаргана.
# - v* tag push: мөн GitHub Release үүсгэнэ → програмууд автоматаар шинэчлэгдэнэ.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller AjliinButeemj.spec --noconfirm

      - name: Self-test + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\AjliinButeemj.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\AjliinButeemj\app.log"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          (Get-FileHash dist\AjliinButeemj.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline dist\AjliinButeemj.exe.sha256

      - name: Self-test + zip + checksum (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/AjliinButeemj.app/Contents/MacOS/AjliinButeemj --selftest
          ditto -c -k --keepParent dist/AjliinButeemj.app dist/AjliinButeemj-mac.zip
          shasum -a 256 dist/AjliinButeemj-mac.zip | cut -d' ' -f1 | tr -d '\n' > dist/AjliinButeemj-mac.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AjliinButeemj-${{ runner.os }}
          path: |
            dist/AjliinButeemj.exe
            dist/AjliinButeemj-mac.zip
          if-no-files-found: ignore

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AjliinButeemj.exe
            dist/AjliinButeemj.exe.sha256
            dist/AjliinButeemj-mac.zip
            dist/AjliinButeemj-mac.zip.sha256
          fail_on_unmatched_files: false
